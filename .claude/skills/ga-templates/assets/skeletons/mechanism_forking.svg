<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22303C"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E64B35"/>
    </marker>
  </defs>

  <!-- white background -->
  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>

  <!-- ================= BACKBONE  A -> B -> C  (vertically centered band) ================= -->
  <!-- slot A -->
  <rect x="80" y="500" width="260" height="200" rx="22" fill="none" stroke="#8A97A3" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="210" y="612" font-size="34" fill="#8A97A3" text-anchor="middle">[ A ]</text>

  <!-- slot B -->
  <rect x="470" y="500" width="260" height="200" rx="22" fill="none" stroke="#8A97A3" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="600" y="612" font-size="34" fill="#8A97A3" text-anchor="middle">[ B ]</text>

  <!-- slot C -->
  <rect x="860" y="500" width="260" height="200" rx="22" fill="none" stroke="#8A97A3" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="990" y="612" font-size="34" fill="#8A97A3" text-anchor="middle">[ C ]</text>

  <!-- backbone arrows -->
  <line x1="348" y1="600" x2="462" y2="600" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="738" y1="600" x2="852" y2="600" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ================= FORK from C ================= -->
  <!-- upper Outcome 1 -->
  <rect x="860" y="170" width="260" height="190" rx="22" fill="none" stroke="#8A97A3" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="990" y="258" font-size="30" fill="#8A97A3" text-anchor="middle">[ Outcome 1 ]</text>

  <!-- lower Outcome 2 = PUNCHLINE (accent) -->
  <rect x="860" y="840" width="260" height="190" rx="22" fill="none" stroke="#E64B35" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="990" y="922" font-size="30" fill="#E64B35" text-anchor="middle">★ Outcome 2</text>

  <!-- fork pivot from top edge / bottom edge of C -->
  <!-- arrow up to Outcome 1 -->
  <line x1="990" y1="494" x2="990" y2="368" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- emphasized arrow down to Outcome 2 (PUNCHLINE) -->
  <line x1="990" y1="706" x2="990" y2="832" stroke="#E64B35" stroke-width="5" marker-end="url(#arrowAccent)"/>

  <!-- archetype name + reading-flow note (bottom-left) -->
  <text x="80" y="1118" font-size="28" fill="#8A97A3">Mechanism / forking</text>
  <text x="80" y="1156" font-size="28" fill="#8A97A3">Read left to right, fork at C.</text>
</svg>
