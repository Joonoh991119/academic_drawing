<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#22303C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- white canvas -->
  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>

  <!-- ===== TOP: question banner ===== -->
  <rect x="160" y="120" width="880" height="180" rx="24" ry="24"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="222" text-anchor="middle" font-size="40" fill="#8A97A3">[ Question? ]</text>

  <!-- arrow: banner -> hero -->
  <line x1="600" y1="300" x2="600" y2="392" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== CENTER: hero result slot (PUNCHLINE, accent, dominant) ===== -->
  <rect x="200" y="400" width="800" height="500" rx="28" ry="28"
        fill="none" stroke="#E64B35" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="600" y="665" text-anchor="middle" font-size="56" fill="#E64B35">&#9733; [ Result ]</text>

  <!-- arrow: hero -> answer -->
  <line x1="600" y1="900" x2="600" y2="992" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== BOTTOM: one-line answer slot ===== -->
  <rect x="160" y="1000" width="880" height="140" rx="24" ry="24"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="1085" text-anchor="middle" font-size="36" fill="#8A97A3">[ Answer in 8 words ]</text>

  <!-- archetype name + reading-flow note (bottom-left) -->
  <text x="40" y="1172" font-size="28" fill="#8A97A3">Single-finding / Q-A  -  flow: top to bottom</text>
</svg>
