<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22303C"/>
    </marker>
  </defs>

  <!-- white background -->
  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>

  <!-- ============ INWARD ARROWS (drawn first, hub/slots overlay the tips) ============ -->
  <!-- Top facet -> hub -->
  <line x1="600" y1="320" x2="600" y2="468" stroke="#22303C" stroke-width="3" marker-end="url(#arrowInk)"/>
  <!-- Bottom facet -> hub -->
  <line x1="600" y1="880" x2="600" y2="732" stroke="#22303C" stroke-width="3" marker-end="url(#arrowInk)"/>
  <!-- Left facet -> hub -->
  <line x1="320" y1="600" x2="468" y2="600" stroke="#22303C" stroke-width="3" marker-end="url(#arrowInk)"/>
  <!-- Right facet -> hub -->
  <line x1="880" y1="600" x2="732" y2="600" stroke="#22303C" stroke-width="3" marker-end="url(#arrowInk)"/>

  <!-- ============ CENTRAL HUB (PUNCHLINE, accent, largest) ============ -->
  <circle cx="600" cy="600" r="132" fill="#FFFFFF" stroke="#E64B35" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="600" y="592" text-anchor="middle" fill="#E64B35" font-size="30" font-weight="bold">★ Core</text>
  <text x="600" y="628" text-anchor="middle" fill="#E64B35" font-size="30" font-weight="bold">finding</text>

  <!-- ============ FOUR PERIPHERAL FACET SLOTS ============ -->
  <!-- Top -->
  <rect x="450" y="180" width="300" height="140" rx="20" ry="20" fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="258" text-anchor="middle" fill="#8A97A3" font-size="28">[ Facet 1 ]</text>

  <!-- Bottom -->
  <rect x="450" y="880" width="300" height="140" rx="20" ry="20" fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="958" text-anchor="middle" fill="#8A97A3" font-size="28">[ Facet 3 ]</text>

  <!-- Left -->
  <rect x="100" y="530" width="300" height="140" rx="20" ry="20" fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="250" y="608" text-anchor="middle" fill="#8A97A3" font-size="28">[ Facet 4 ]</text>

  <!-- Right -->
  <rect x="800" y="530" width="300" height="140" rx="20" ry="20" fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="950" y="608" text-anchor="middle" fill="#8A97A3" font-size="28">[ Facet 2 ]</text>

  <!-- ============ ARCHETYPE NOTE (bottom-left) ============ -->
  <text x="80" y="1132" fill="#8A97A3" font-size="28" font-weight="bold">Hub-and-spoke</text>
  <text x="80" y="1170" fill="#8A97A3" font-size="28">Flow: facets converge to the core</text>
</svg>
