<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22303C"/>
    </marker>
  </defs>

  <!-- white background -->
  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>

  <!-- ============ LEFT COLUMN (A) ============ -->
  <!-- Condition A slot -->
  <rect x="120" y="180" width="360" height="300" rx="22" ry="22"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="300" y="340" text-anchor="middle" font-size="40" fill="#8A97A3">[ Condition A ]</text>

  <!-- arrow A: Condition A -> Result A -->
  <line x1="300" y1="490" x2="300" y2="610" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Result A slot -->
  <rect x="120" y="640" width="360" height="300" rx="22" ry="22"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="300" y="800" text-anchor="middle" font-size="40" fill="#8A97A3">[ Result A ]</text>

  <!-- ============ RIGHT COLUMN (B) ============ -->
  <!-- Condition B slot -->
  <rect x="720" y="180" width="360" height="300" rx="22" ry="22"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="900" y="340" text-anchor="middle" font-size="40" fill="#8A97A3">[ Condition B ]</text>

  <!-- arrow B: Condition B -> Result B -->
  <line x1="900" y1="490" x2="900" y2="610" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Result B slot -->
  <rect x="720" y="640" width="360" height="300" rx="22" ry="22"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="900" y="800" text-anchor="middle" font-size="40" fill="#8A97A3">[ Result B ]</text>

  <!-- ============ CENTER VERDICT STRIP (PUNCHLINE, accent) ============ -->
  <rect x="525" y="180" width="150" height="760" rx="22" ry="22"
        fill="none" stroke="#E64B35" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- vertical label, centered in strip -->
  <text x="600" y="560" text-anchor="middle" font-size="40" fill="#E64B35"
        transform="rotate(-90 600 560)">[ &#9733; Verdict / &#916; ]</text>

  <!-- ============ ARCHETYPE NOTE (bottom-left, neutral) ============ -->
  <text x="120" y="1070" font-size="36" fill="#8A97A3">Comparison / A-vs-B</text>
  <text x="120" y="1112" font-size="34" fill="#8A97A3">Reading flow: each column top to bottom.</text>
</svg>
