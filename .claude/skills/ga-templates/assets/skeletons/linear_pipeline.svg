<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22303C"/>
    </marker>
  </defs>

  <!-- white background -->
  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>

  <!-- ============ SLOT 1: Context / problem ============ -->
  <rect x="150" y="90" width="900" height="190" rx="22" ry="22"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="195" font-size="34" fill="#8A97A3" text-anchor="middle"
        dominant-baseline="middle">[ Context / problem ]</text>

  <!-- arrow 1 -> 2 -->
  <line x1="600" y1="290" x2="600" y2="340" stroke="#22303C" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- ============ SLOT 2: Method / approach ============ -->
  <rect x="150" y="355" width="900" height="190" rx="22" ry="22"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="460" font-size="34" fill="#8A97A3" text-anchor="middle"
        dominant-baseline="middle">[ Method / approach ]</text>

  <!-- arrow 2 -> 3 -->
  <line x1="600" y1="555" x2="600" y2="605" stroke="#22303C" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- ============ SLOT 3: Key finding (PUNCHLINE / accent) ============ -->
  <rect x="150" y="620" width="900" height="190" rx="22" ry="22"
        fill="none" stroke="#E64B35" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="600" y="725" font-size="36" fill="#E64B35" text-anchor="middle"
        dominant-baseline="middle">[ &#9733; Key finding ]</text>

  <!-- arrow 3 -> 4 -->
  <line x1="600" y1="820" x2="600" y2="870" stroke="#22303C" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- ============ SLOT 4: Implication ============ -->
  <rect x="150" y="885" width="900" height="190" rx="22" ry="22"
        fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="990" font-size="34" fill="#8A97A3" text-anchor="middle"
        dominant-baseline="middle">[ Implication ]</text>

  <!-- archetype name + reading-flow note (bottom-left) -->
  <text x="40" y="1135" font-size="28" fill="#8A97A3">Linear pipeline</text>
  <text x="40" y="1170" font-size="28" fill="#8A97A3">Reading flow: top to bottom</text>
</svg>
