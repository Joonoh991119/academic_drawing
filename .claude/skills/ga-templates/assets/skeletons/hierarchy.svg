<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22303C"/>
    </marker>
  </defs>

  <!-- white background -->
  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>

  <!-- ============ LEVEL 1: MACRO / ORGANISM (whole) ============ -->
  <rect x="80" y="110" width="1040" height="250" rx="22" ry="22"
        fill="none" stroke="#8A97A3" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="600" y="246" font-size="44" fill="#8A97A3" text-anchor="middle">[ Macro / organism ]</text>

  <!-- zoom connector 1 -->
  <line x1="600" y1="360" x2="600" y2="470" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ LEVEL 2: MESO / TISSUE ============ -->
  <rect x="170" y="480" width="860" height="230" rx="20" ry="20"
        fill="none" stroke="#8A97A3" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="600" y="605" font-size="42" fill="#8A97A3" text-anchor="middle">[ Meso / tissue ]</text>

  <!-- zoom connector 2 -->
  <line x1="600" y1="710" x2="600" y2="815" stroke="#22303C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ LEVEL 3: MICRO / MOLECULE (PUNCHLINE, accent, framed zoom-inset) ============ -->
  <!-- outer accent frame = zoom-inset framing -->
  <rect x="300" y="825" width="600" height="290" rx="18" ry="18"
        fill="#FFFFFF" stroke="#E64B35" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- inner inset border (thin, to read as a framed crop) -->
  <rect x="330" y="855" width="540" height="200" rx="10" ry="10"
        fill="none" stroke="#E64B35" stroke-width="1.5"/>
  <text x="600" y="968" font-size="42" fill="#E64B35" text-anchor="middle">★ [ Micro / molecule ]</text>

  <!-- ============ archetype name + reading-flow note (bottom-left, neutral) ============ -->
  <text x="80" y="1148" font-size="30" fill="#8A97A3">Hierarchy / multi-scale</text>
  <text x="80" y="1186" font-size="30" fill="#8A97A3">Read top to bottom: whole to detail (zoom)</text>
</svg>
